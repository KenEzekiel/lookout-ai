name: Deploy to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret before deploying."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Build and validate production bundle
        run: pnpm --filter @lookout/app deploy:check
      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @lookout/app exec wrangler d1 migrations apply DB --remote --env production --config wrangler.jsonc
      - name: Deploy production bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @lookout/app exec wrangler deploy
      - name: Check deployed app
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 https://lookout-app.lookout-ai.workers.dev/ --output /dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 https://lookout-app.lookout-ai.workers.dev/api/access/principal --output /dev/null
